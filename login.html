<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PESSAVA — Login / Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0a;
      --white: #f5f3ef;
      --accent: #e8372a;
      --gray: #888;
      --light: #f0ede8;
      --border: #ddd9d2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .announce {
      background: var(--black);
      color: var(--white);
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 8px;
      text-transform: uppercase;
    }

    nav {
      background: var(--white);
      border-bottom: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      height: 60px;
    }

    .nav-logo {
      text-decoration: none;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .nav-logo img {
      height: 44px;
      width: auto;
    }

    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .auth-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px;
      width: 100%;
      max-width: 420px;
    }

    .tabs {
      display: flex;
      background: var(--light);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      border: none;
      background: none;
      font-family: 'DM Sans', sans-serif;
      color: var(--gray);
    }

    .tab.active {
      background: #fff;
      color: var(--black);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .form-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .form-sub {
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      background: #fff;
      outline: none;
      color: var(--black);
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--black);
    }

    .input-wrapper {
      position: relative;
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--gray);
    }

    .btn-submit {
      width: 100%;
      background: var(--black);
      color: #fff;
      padding: 14px;
      border-radius: 6px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.85;
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .switch-text {
      text-align: center;
      font-size: 13px;
      color: var(--gray);
      margin-top: 20px;
    }

    .switch-text a {
      color: var(--black);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .terms {
      font-size: 11px;
      color: var(--gray);
      text-align: center;
      margin-top: 16px;
      line-height: 1.6;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .alert.error {
      background: #ffeaea;
      color: #c0392b;
      border: 1px solid #f5c6cb;
    }

    .alert.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c3e6cb;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .success-screen {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .success-screen .check {
      font-size: 56px;
      margin-bottom: 16px;
    }

    .success-screen h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .success-screen p {
      color: var(--gray);
      font-size: 14px;
      margin-bottom: 24px;
    }

    @media(max-width:480px) {
      .auth-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="announce">FREE SHIPPING ABOVE Rs.499 | CODE: PESSAVA20</div>
  <nav>
    <a href="index.html" class="nav-logo"><img src="pessava-logo.png" alt="PESSAVA"></a>
  </nav>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('signup')">Sign Up</button>
      </div>
      <div class="alert" id="alertBox"></div>
      <!-- LOGIN -->
      <div class="form-section active" id="loginForm">
        <div class="form-title">Welcome Back!</div>
        <div class="form-sub">Login to track orders and save wishlist</div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" class="form-input" id="loginPass" placeholder="Your password">
            <button class="toggle-pass" onclick="togglePass('loginPass',this)" type="button">show</button>
          </div>
        </div>
        <button class="btn-submit" id="loginBtn" onclick="doLogin()">Login to PESSAVA</button>
        <div class="switch-text">No account? <a onclick="switchTab('signup')">Sign Up</a></div>
      </div>
      <!-- SIGNUP -->
      <div class="form-section" id="signupForm">
        <div class="form-title">Create Account</div>
        <div class="form-sub">Join PESSAVA - it is free!</div>
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="signupName" placeholder="Your full name">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="signupEmail" placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Mobile Number</label>
          <input type="tel" class="form-input" id="signupMobile" placeholder="10-digit mobile number">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" class="form-input" id="signupPass" placeholder="Min. 6 characters">
            <button class="toggle-pass" onclick="togglePass('signupPass',this)" type="button">show</button>
          </div>
        </div>
        <button class="btn-submit" id="signupBtn" onclick="doSignup()">Create My Account</button>
        <div class="switch-text">Already registered? <a onclick="switchTab('login')">Login</a></div>
        <div class="terms">By signing up you agree to our Terms and Privacy Policy</div>
      </div>
      <!-- SUCCESS -->
      <div class="success-screen" id="successScreen">
        <div class="check">done</div>
        <h3>YOU ARE IN!</h3>
        <p id="successMsg">Welcome to PESSAVA!</p>
        <a href="index.html"
          style="display:inline-block;background:var(--black);color:#fff;padding:13px 32px;border-radius:6px;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;">Start
          Shopping</a>
      </div>
    </div>
  </div>
  <script>
    const API = 'http://localhost:5000/api';
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'signup' && i === 1));
      });
      document.getElementById('loginForm').classList.toggle('active', tab === 'login');
      document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
      hideAlert();
    }
    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alertBox');
      box.textContent = msg; box.className = 'alert ' + type; box.style.display = 'block';
    }
    function hideAlert() { document.getElementById('alertBox').style.display = 'none'; }
    function togglePass(id, btn) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? 'show' : 'hide';
    }
    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value;
      if (!email || !password) { showAlert('Please fill all fields'); return; }
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.innerHTML = '<span class="loading"></span>Logging in...';
      try {
        const res = await fetch(API + '/users/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('pessava_token', data.token);
          localStorage.setItem('pessava_user', JSON.stringify(data.user));
          document.getElementById('loginForm').classList.remove('active');
          document.querySelector('.tabs').style.display = 'none';
          document.getElementById('successScreen').style.display = 'block';
          document.getElementById('successMsg').textContent = 'Welcome back, ' + data.user.name + '!';
          setTimeout(() => window.location.href = 'index.html', 1500);
        } else {
          showAlert(data.message || 'Login failed');
          btn.disabled = false; btn.textContent = 'Login to PESSAVA';
        }
      } catch (err) {
        showAlert('Server nahi chal raha! Terminal mein: cd backend, node server.js');
        btn.disabled = false; btn.textContent = 'Login to PESSAVA';
      }
    }
    async function doSignup() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const mobile = document.getElementById('signupMobile').value.trim();
      const password = document.getElementById('signupPass').value;
      if (!name || !email || !mobile || !password) { showAlert('Please fill all fields'); return; }
      if (mobile.length !== 10) { showAlert('Enter valid 10-digit mobile'); return; }
      if (password.length < 6) { showAlert('Password min 6 characters'); return; }
      const btn = document.getElementById('signupBtn');
      btn.disabled = true; btn.innerHTML = '<span class="loading"></span>Creating account...';
      try {
        const res = await fetch(API + '/users/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, mobile, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('pessava_token', data.token);
          localStorage.setItem('pessava_user', JSON.stringify(data.user));
          document.getElementById('signupForm').classList.remove('active');
          document.querySelector('.tabs').style.display = 'none';
          document.getElementById('successScreen').style.display = 'block';
          document.getElementById('successMsg').textContent = 'Welcome to PESSAVA, ' + data.user.name + '!';
          setTimeout(() => window.location.href = 'index.html', 1500);
        } else {
          showAlert(data.message || 'Signup failed');
          btn.disabled = false; btn.textContent = 'Create My Account';
        }
      } catch (err) {
        showAlert('Server nahi chal raha! Terminal mein: cd backend, node server.js');
        btn.disabled = false; btn.textContent = 'Create My Account';
      }
    }
    const user = JSON.parse(localStorage.getItem('pessava_user') || 'null');
    if (user) {
      document.querySelector('.tabs').style.display = 'none';
      document.getElementById('loginForm').classList.remove('active');
      document.getElementById('successScreen').style.display = 'block';
      document.getElementById('successMsg').textContent = 'Already logged in as ' + user.name;
    }
  </script>
</body>

</html>
